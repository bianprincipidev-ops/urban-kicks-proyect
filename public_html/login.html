<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Urban Kicks</title>
    <meta name="description" content="Urban Kicks - Las mejores zapatillas urbanas en Río Cuarto. Nike, Adidas, Jordan, Vans y más.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" as="image" href="logo-urban.png" fetchpriority="high">
    <script src="main.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <div class="split-container">
            
            <div class="auth-image-side">
                <div class="auth-image-content">
                    <img src="logo-urban.png" alt="Urban Kicks" class="auth-logo-large">
                </div>
            </div>

            <div class="auth-form-side">
                <div class="auth-form-content">
                    
                    <div class="form-header">
                        <h2>INICIAR SESIÓN</h2>
                        <p>¡Qué bueno verte de nuevo!</p>
                    </div>
                    
                    <form id="login-form">
                        <div class="input-group">
                            <label>EMAIL</label>
                            <input type="email" id="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="input-group">
                            <label>CONTRASEÑA</label>
                            <div style="position: relative; display: flex; align-items: center;">
                                <input type="password" id="password" placeholder="********" required style="width: 100%; padding-right: 40px;">
                                <i class="ri-eye-off-line" id="togglePassword" style="position: absolute; right: 10px; cursor: pointer; color: #999;"></i>    
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-entrar-split">ENTRAR</button>
                        
                        <div class="auth-footer">
                            <a href="javascript:void(0)" onclick="mostrarModalRecuperacion()" class="forgot-password">¿Olvidaste tu contraseña?</a>
                            <p>¿No tenés cuenta? <a href="/registro">Crear cuenta</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="modalRecuperar" class="modal-recuperar">
        <div class="modal-content">
            <div id="paso1">
                <h2>Recuperar</h2>
                <p>Enviaremos un código a tu email.</p>
                <input type="email" id="emailRecuperar" placeholder="tu@email.com" class="modal-input">
                <button id="btnEnviarCodigo" onclick="enviarCodigo()" class="btn-modal">ENVIAR CÓDIGO</button>
            </div>

            <div id="paso2" style="display:none;">
                <h2>Verificar</h2>
                <p>Ingresa el código y tu nueva contraseña.</p>
                <input type="text" id="codigoVerificacion" placeholder="Código de 6 dígitos" class="modal-input">
                <input type="password" id="nuevaPassword" placeholder="Nueva Contraseña" class="modal-input">
                <button id="btnRestablecer" onclick="cambiarPassword()" class="btn-modal">RESTABLECER</button>
            </div>

            <button onclick="cerrarModal()" class="btn-cancelar">Volver al login</button>
        </div>
    </div>

<script>
    document.getElementById('login-form').onsubmit = ejecutarLogin;
    function enviarCodigo() { enviarCodigoRecuperacion(); }
    function cambiarPassword() { cambiarPasswordRecuperacion(); }

    // Lógica del ojito (Corregida)
    const togglePassword = document.querySelector('#togglePassword');
    const passwordField = document.querySelector('#password'); // Usamos un nombre claro

    if (togglePassword && passwordField) {
        togglePassword.addEventListener('click', function () {
            // Verificamos el tipo actual y lo cambiamos
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);

            // Cambiamos el icono del ojito
            this.classList.toggle('ri-eye-line');
            this.classList.toggle('ri-eye-off-line');
        });
    }

    window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (token) {
                localStorage.setItem('urban_token', token);
                // Pequeño truco: si es admin, lo mandamos al panel, si no al index
                // Podrías decodificar el JWT aquí, o simplemente mandarlo al index.html
                window.location.href = '/index.html'; 
            }
        };
        
        // Aseguramos el onsubmit manual
        document.getElementById('login-form').onsubmit = ejecutarLogin;

</script>
</body>
</html>
