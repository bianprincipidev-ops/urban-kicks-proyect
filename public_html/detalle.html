<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | Urban Kicks</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="main.js"></script>
    <style>
        /* Estilo para quitar las flechitas por defecto del input number */
        #cantidad::-webkit-outer-spin-button,
        #cantidad::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .quantity-controls button:hover { background: #f4f4f4 !important; }
        .active-size { background: #000 !important; color: #fff !important; border-color: #000 !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="/tienda"><img src="logo-urban.png" alt="Urban Kicks Logo"></a>
        </div>
        <nav class="nav-links">
            <a href="/tienda?categoria=1">Urbano</a>
            <a href="/tienda?categoria=2">Hombre</a>
            <a href="/tienda?categoria=3">Mujer</a>
        </nav>
        <div class="header-icons">
            <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar modo">
                <i id="theme-icon" class="ri-moon-line"></i>
            </button>
            <a href="/login" id="user-link" title="Mi Cuenta"><i class="ri-user-line"></i></a>
            <a href="/carrito"><i class="ri-shopping-cart-line"></i></a>
            <button id="btn-logout" onclick="logout()" title="Cerrar Sesión" style="display: none; background: none; border: none; cursor: pointer; padding: 0;">
                <i class="ri-logout-box-r-line" style="font-size: 1.5rem; color: #ff4d4d;"></i>
            </button>
        </div>
    </header>

    <div class="breadcrumb" style="padding: 10px 40px; font-size: 0.85rem; color: #888;">
        <a href="/tienda" style="color:#888; text-decoration:none;">Tienda</a>
        <span style="margin: 0 6px;">/</span>
        <span id="breadcrumb-nombre" style="color: var(--text-color, #333);">Cargando...</span>
    </div>

    <main class="product-detail-container">
        <div class="product-gallery-container" style="display: flex; gap: 20px; align-items: flex-start;">
            <div id="contenedor-miniaturas-lateral" style="display: flex; flex-direction: column; gap: 10px;"></div>
            <div class="product-image" style="flex: 1;">
                <img id="img-producto" src="" alt="Cargando..." style="width: 100%; max-width: 500px; border-radius: 8px;">
            </div>
        </div>
        
        <div class="product-info">
            <p id="color-producto" style="font-size: 0.85rem; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;"></p>
            <h1 id="nombre-producto">Cargando...</h1>
            <span class="product-price" id="precio-producto">$0.00</span>
            <p class="product-description" id="descripcion-producto" style="margin: 16px 0; line-height: 1.6;"></p>
            
            <div class="size-selector">
                <span style="font-weight: bold; font-size: 0.9rem;">Seleccionar Talle:</span>
                <div class="size-options" id="contenedor-talles" style="margin-top: 10px;">
                    <p style="color: #888;">Cargando talles...</p>
                </div>
                <p id="stock-info" style="font-size: 0.8rem; color: #888; margin-top: 8px; min-height: 18px;"></p>
            </div>

            // Seleccionar cantidad (opcional, por defecto 1)
            <div class="quantity-selector" style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
                <span style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #444;">Cantidad</span>
                <div class="quantity-controls" style="margin-top: 12px; display: flex; align-items: center; border: 1px solid #000; width: fit-content; border-radius: 4px; overflow: hidden;">
                    <button onclick="restarCantidad()" style="background: white; border: none; padding: 10px 15px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; color: #000;">-</button>
                    <input type="number" id="cantidad" value="1" min="1" readonly 
                        style="width: 50px; text-align: center; border: none; border-left: 1px solid #eee; border-right: 1px solid #eee; font-weight: 700; font-family: inherit; font-size: 1rem; color: #000; -moz-appearance: textfield;">
                    <button onclick="sumarCantidad()" style="background: white; border: none; padding: 10px 15px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; color: #000;">+</button>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button class="btn-add-to-cart" onclick="agregarAlCarrito()">
                    <i class="ri-shopping-cart-line"></i> AÑADIR AL CARRITO
                </button>
                <a id="btn-whatsapp" href="#" target="_blank" class="wsp-detail-btn">
                    <i class="ri-whatsapp-line"></i> CONSULTAR POR WHATSAPP
                </a>
            </div>
        </div>
    </main>

    <section class="related-products" style="padding: 40px; border-top: 1px solid #eee; margin-top: 50px;">
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 1.5rem; text-transform: uppercase;">Productos Similares</h2>
        <div class="grid-productos" id="contenedor-relacionados"></div>
    </section>

<script>
    let productoActual = null;
    let talleSeleccionado = null;
    let stockSeleccionado = 0;
    let cantidad = 1; 
    let tipoProducto = '';
    
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        tipoProducto = params.get('tipo') || 'zapatilla';

        if (!id) return window.location.href = '/tienda';

        try {
            const rutaApi = tipoProducto === 'ropa' ? `/api/ropa/${id}` : `/api/productos/${id}`;
            const res = await fetch(rutaApi);
            productoActual = await res.json();

            if (res.ok) {
                document.getElementById('breadcrumb-nombre').innerText = productoActual.name;
                document.getElementById('nombre-producto').innerText = productoActual.name;
                document.getElementById('precio-producto').innerText = `$${Number(productoActual.price).toLocaleString('es-AR')}`;
                document.getElementById('descripcion-producto').innerText = productoActual.description || '';
                
                const imagenes = productoActual.image_url.split(',');
                document.getElementById('img-producto').src = imagenes[0];

                cargarRelacionados(tipoProducto, id, productoActual.category_id);

                if (imagenes.length > 1) {
                    const lateral = document.getElementById('contenedor-miniaturas-lateral');
                    lateral.innerHTML = imagenes.map(img => `
                        <img src="${img}" onmouseover="document.getElementById('img-producto').src='${img}'" class="thumb-lateral" style="width:60px; height:60px; object-fit:cover; border-radius:4px; cursor:pointer; border:1px solid #ddd;">
                    `).join('');
                }

                const contenedorTallas = document.getElementById('contenedor-talles');
                contenedorTallas.innerHTML = productoActual.sizes.map(s => `
                    <button class="size-btn" onclick="seleccionarTalle(this, '${s.size}', ${s.stock})">${s.size}</button>
                `).join('');

                const msg = encodeURIComponent(`¡Hola! Consulto por: ${productoActual.name} (${tipoProducto})`);
                document.getElementById('btn-whatsapp').href = `https://wa.me/5493585756996?text=${msg}`;
            }
        } catch (e) { console.error(e); }
    });

    function seleccionarTalle(elemento, talle, stock) {
        document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active-size'));
        elemento.classList.add('active-size');
        talleSeleccionado = talle;
        stockSeleccionado = stock;
        
        cantidad = 1;
        document.getElementById('cantidad').value = cantidad;
        
        document.getElementById('stock-info').innerText = `${stock} disponibles`;
        document.getElementById('stock-info').style.color = stock < 3 ? "#ff4d4d" : "#888";
    }

    async function cargarRelacionados(tipoActual, idActual, categoriaId) {
        try {
            const ruta = tipoActual === 'ropa' ? '/api/ropa' : '/api/productos';
            const res = await fetch(ruta);
            const productos = await res.json();

            const relacionados = productos
                .filter(p => p.id !== parseInt(idActual))
                .filter(p => tipoActual === 'ropa' ? true : p.category_id == categoriaId)
                .slice(0, 4);

            const contenedor = document.getElementById('contenedor-relacionados');
            if (relacionados.length === 0) {
                document.querySelector('.related-products').style.display = 'none';
                return;
            }

            contenedor.innerHTML = relacionados.map(p => {
                const img = p.image_url.split(',')[0];
                return `
                    <div class="card">
                        <img src="${img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <span class="precio">$${Number(p.price).toLocaleString('es-AR')}</span>
                        <a href="/detalle?id=${p.id}&tipo=${tipoActual}" class="btn-comprar">Ver Detalle</a>
                    </div>`;
            }).join('');
        } catch (e) { console.error("Error relacionados:", e); }
    }

    // --- FUNCIONES DE CANTIDAD CORREGIDAS ---
    function sumarCantidad() {
        if (!talleSeleccionado) {
            alert("Primero seleccioná un talle.");
            return;
        }
        if (cantidad < stockSeleccionado) {
            cantidad++;
            document.getElementById('cantidad').value = cantidad;
        } else {
            alert(`Solo hay ${stockSeleccionado} unidades disponibles.`);
        }
    }

    function restarCantidad() {
        if (cantidad > 1) {
            cantidad--;
            document.getElementById('cantidad').value = cantidad;
        }
    }

    function agregarAlCarrito() {
        if (!localStorage.getItem('urban_token')) {
            alert("Iniciá sesión para comprar.");
            return window.location.href = '/login';
        }
        if (!talleSeleccionado) return alert("Seleccioná un talle.");

        if (cantidad > stockSeleccionado) {
            alert("La cantidad seleccionada supera el stock disponible.");
            return;
        }

        let carrito = JSON.parse(localStorage.getItem('urban_cart')) || [];
        const existente = carrito.find(i => i.id === productoActual.id && i.size === talleSeleccionado && i.tipo === tipoProducto);
        
        if(existente) {
            if ((existente.cantidad + cantidad) > stockSeleccionado) {
                alert(`Superás el stock de ${stockSeleccionado} unidades.`);
                return;
            }
            existente.cantidad += cantidad;
        } else {
            carrito.push({ 
                id: productoActual.id, 
                tipo: tipoProducto,
                name: productoActual.name, 
                price: productoActual.price, 
                image: productoActual.image_url.split(',')[0],
                size: talleSeleccionado, 
                cantidad: cantidad 
            });
        }
        localStorage.setItem('urban_cart', JSON.stringify(carrito));
        window.location.href = '/carrito';
    }
</script>
</body>
</html>
