<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Urban Kicks</title>
    <meta name="description" content="Urban Kicks - Las mejores zapatillas urbanas en Río Cuarto. Nike, Adidas, Jordan, Vans y más.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" as="image" href="logo-urban.png" fetchpriority="high">
    <script src="main.js"></script>
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <div class="split-container">
            
            <div class="auth-image-side">
                <div class="auth-image-content">
                    <img src="logo-urban.png" alt="Urban Kicks" class="auth-logo-large">
                </div>
            </div>

            <div class="auth-form-side">
                <div class="auth-form-content">
                    
                    <div class="form-header">
                        <h2>CREAR CUENTA</h2>
                        <p>¡Bienvenido a Urban Kicks!</p>
                    </div>

                    <form id="registroForm">
                        <div class="input-group">
                            <label>NOMBRE</label>
                            <input type="text" id="name" placeholder="Tu nombre" required>
                        </div>
                        <div class="input-group">
                            <label>EMAIL</label>
                            <input type="email" id="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="input-group">
                            <label>CONTRASEÑA</label>
                            <input type="password" id="password" placeholder="********" required>
                        </div>
                        <div class="input-group">
                            <label>CONFIRMAR CONTRASEÑA</label>
                            <input type="password" id="confirmPassword" placeholder="********" required>
                        </div>

                        <button type="submit" class="btn-entrar-split">CREAR CUENTA</button>

                        <div style="margin-top: 15px;">
                            <a href="/api/auth/google" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; color: #444; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.3s;">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18">
                                Registrarse con Google
                            </a>
                        </div>
                        
                        <div class="auth-footer">
                            <p>¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
                        </div>
                    </form>
<script>
    window.onload = () => {
        // Asignamos el submit manual
        const form = document.getElementById('registroForm');
        if(form) form.onsubmit = ejecutarRegistro;

        // Lógica para capturar el token de Google
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const error = urlParams.get('error');

        if (token) {
            localStorage.setItem('urban_token', token);
            alert("¡Registro exitoso!");
            window.location.href = 'index.html'; 
        }
        if (error) {
            alert("Error al registrarse con Google.");
        }
    };
</script>
</body>
</html>
