<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | Urban Kicks</title>
    <meta name="description" content="Urban Kicks - Las mejores zapatillas urbanas en Río Cuarto. Nike, Adidas, Jordan, Vans y más.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="main.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="/tienda"><img src="logo-urban.png" alt="Urban Kicks Logo"></a>
        </div>
        <nav class="nav-links">
            <a href="javascript:void(0)" onclick="cargarProductos('1')">Urbano</a>
            <a href="javascript:void(0)" onclick="cargarProductos('2')">Hombre</a>
            <a href="javascript:void(0)" onclick="cargarProductos('3')">Mujer</a>
            <a href="javascript:void(0)" onclick="abrirModalTalles()">Tabla de Talles</a>
        </nav>
        <div class="header-icons">
            <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar modo">
                <i id="theme-icon" class="ri-moon-line"></i>
            </button>
            <a href="/login" id="user-link" title="Mi Cuenta"><i class="ri-user-line"></i></a>
            <a href="/carrito"><i class="ri-shopping-cart-line"></i></a>
            <button id="btn-logout" onclick="logout()" title="Cerrar Sesión" style="display: none; background: none; border: none; cursor: pointer; padding: 0;">
                <i class="ri-logout-box-r-line" style="font-size: 1.5rem; color: #ff4d4d;"></i>
            </button>
        </div>
    </header>

    <div id="modalTalles" class="modal" style="display:none;">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close" onclick="cerrarModalTalles()">&times;</span>
            <h3>Tabla de Talles</h3>
            <div style="margin-bottom: 12px;">
                <select id="selectMarcaTalle" onchange="cargarTablaTalle()" style="width:100%; padding:10px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
                    <option value="">-- Seleccioná una marca --</option>
                </select>
            </div>
            <div id="contenedor-tabla-talle" style="text-align:center; color:#888;">
                Seleccioná una marca para ver su tabla.
            </div>
        </div>
    </div>

    <main class="cart-container">
        <h1>Tu Carrito</h1>
        <div id="cart-items">
            </div>

            <div class="cart-totals-container" style="background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 30px;">
                
                <div class="summary-line" style="display: flex; justify-content: space-between; margin-bottom: 12px; color: #666;">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" style="font-weight: 600; color: #000;">$0.00</span>
                </div>

                <div class="summary-line shipping-notice" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #f4f4f4; border-bottom: 1px solid #f4f4f4; margin-bottom: 15px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="ri-truck-line" style="color: #000; font-size: 1.1rem;"></i>
                        <span style="font-size: 0.9rem; color: #444;">Envío</span>
                    </div>
                    <span style="font-size: 0.85rem; font-weight: 600; color: #000; background: #f0f0f0; padding: 4px 12px; border-radius: 20px;">
                        A COORDINAR CON VENDEDOR
                    </span>
                </div>

                <div class="summary-line total-line" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                    <span style="font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Total</span>
                    <span id="cart-total" style="font-size: 1.5rem; font-weight: 900; color: #000;">$0.00</span>
                </div>

                <div class="cart-actions" style="display: flex; flex-direction: column; gap: 12px; margin-top: 25px;">
                    <button onclick="finalizarPedido()" class="btn-whatsapp-final" style="background: #25D366; color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;">
                        <i class="ri-whatsapp-line" style="font-size: 1.3rem;"></i> FINALIZAR POR WHATSAPP
                    </button>
                    <a href="/tienda" style="text-align: center; color: #888; text-decoration: none; font-size: 0.9rem; font-weight: 600; padding: 10px;">
                        ← SEGUIR COMPRANDO
                    </a>
                </div>
            </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        renderizarCarrito();
    });

    function renderizarCarrito() {
            const lista = JSON.parse(localStorage.getItem('urban_cart')) || [];
            const contenedor = document.getElementById('cart-items');
            let total = 0;

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div style="text-align:center; padding: 50px;">
                        <i class="ri-shopping-cart-2-line" style="font-size: 4rem; color: #ccc;"></i>
                        <p style="margin-top: 15px; color: #888;">Tu carrito está vacío</p>
                    </div>`;
                if(document.getElementById('cart-total')) document.getElementById('cart-total').innerText = "$0";
                if(document.getElementById('cart-subtotal')) document.getElementById('cart-subtotal').innerText = "$0";
                return;
            }

            contenedor.innerHTML = "";
            lista.forEach((item, index) => {
                const cantidad = item.cantidad || 1;
                const subtotalItem = item.price * cantidad;
                total += subtotalItem;

                contenedor.innerHTML += `
                    <div class="cart-item" style="display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #eee; width: 100%;">
                        <img src="${item.image}" alt="${item.name}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px; flex-shrink: 0;">
                        
                        <div class="cart-item-info" style="flex: 1; min-width: 0;">
                            <h4 style="margin: 0; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name}</h4>
                            <p style="margin: 4px 0; color: #888; font-size: 0.8rem;">Talle: <strong>${item.size}</strong></p>
                            
                            <div style="display: flex; align-items: center; gap: 10px; margin: 8px 0;">
                                <button onclick="actualizarCantidad(${index}, -1)" style="cursor:pointer; width:25px; height:25px; border:1px solid #ddd; background:#fff; border-radius:4px; display: flex; align-items: center; justify-content: center;">−</button>
                                <span style="font-weight: bold;">${cantidad}</span>
                                <button onclick="actualizarCantidad(${index}, 1)" style="cursor:pointer; width:25px; height:25px; border:1px solid #ddd; background:#fff; border-radius:4px; display: flex; align-items: center; justify-content: center;">+</button>
                            </div>

                            <span style="font-weight: 700; display: block;">$${Number(item.price).toLocaleString('es-AR')}</span>
                        </div>

                        <button onclick="eliminarDelCarrito(${index})" 
                                style="background: #ff4d4d; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; flex-shrink: 0; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; margin-left: 10px;" 
                                title="Eliminar">
                            <i class="ri-delete-bin-line" style="font-size: 1.2rem; color: white !important;"></i>
                        </button>
                    </div>`;
            });

            actualizarTotales(total);
        }

    function actualizarCantidad(index, delta) {
        let carrito = JSON.parse(localStorage.getItem('urban_cart')) || [];
        let nuevaCant = (carrito[index].cantidad || 1) + delta;

        // Si es menos de 1, preguntamos si quiere eliminar
        if (nuevaCant < 1) {
            eliminarDelCarrito(index);
        } else {
            carrito[index].cantidad = nuevaCant;
            localStorage.setItem('urban_cart', JSON.stringify(carrito));
            renderizarCarrito();
        }
    }

    function eliminarDelCarrito(index) {
        if(confirm("¿Quitar este producto del carrito?")) {
            let carrito = JSON.parse(localStorage.getItem('urban_cart')) || [];
            carrito.splice(index, 1);
            localStorage.setItem('urban_cart', JSON.stringify(carrito));
            renderizarCarrito();
        }
    }

    function finalizarPedido() {
        const carrito = JSON.parse(localStorage.getItem('urban_cart')) || [];
        if (carrito.length === 0) return alert("El carrito está vacío");

        let mensaje = "¡Hola Urban Kicks! 🔥 Quisiera realizar el siguiente pedido:\n\n";
        let total = 0;

        carrito.forEach(i => {
            const cant = i.cantidad || 1;
            const sub = i.price * cant;
            mensaje += `▪️ *${i.name}*\n`;
            mensaje += `   Talle: ${i.size} | Cant: ${cant}\n`;
            mensaje += `   Subtotal: $${sub.toLocaleString('es-AR')}\n\n`;
            total += sub;
        });

        mensaje += `*TOTAL A PAGAR: $${total.toLocaleString('es-AR')}*`;
        mensaje += `\n\n_Envío a coordinar con el vendedor (Río Cuarto)_ 👟`;

        const url = `https://wa.me/5493585756996?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    function actualizarTotales(total) {
        const subtotalElem = document.getElementById('cart-subtotal');
        const totalElem = document.getElementById('cart-total');
        if(subtotalElem) subtotalElem.innerText = `$${total.toLocaleString('es-AR')}`;
        if(totalElem) totalElem.innerText = `$${total.toLocaleString('es-AR')}`;
    }
</script>
</body>
</html>
